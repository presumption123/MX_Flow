<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Sheet</title>
  <link rel="stylesheet" href="/css/debate-flow.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/flow-grid.css">
  <script src="/lib/mammoth.browser.min.js"></script>
</head>
<body>
  <div id="mobile-banner" class="mobile-banner" role="status">
    Use landscape on a laptop for flowing.
  </div>
  <div id="status-banner" class="status-banner hidden" role="alert"></div>

  <div id="app">
    <!-- Dashboard view -->
    <div id="dashboard-view">
      <aside id="sidebar" aria-label="Navigation">
        <div class="sidebar-brand">New Sheet</div>
        <div class="sidebar-section-label">Folders</div>
        <div id="folder-list" class="folder-list"></div>
        <button type="button" id="folder-add-btn" class="folder-add-btn">+ New folder</button>
        <div class="sidebar-footer">
          <button type="button" class="tb-btn" id="sidebar-settings">Settings</button>
          <button type="button" class="tb-btn" id="sidebar-import">Import Backup</button>
          <button type="button" class="tb-btn primary" id="sidebar-new-round">+ New Round</button>
        </div>
      </aside>
      <main id="dashboard-main">
        <div class="dashboard-header">
          <h1 id="dashboard-folder-title">All Rounds</h1>
          <input type="search" id="dashboard-search" class="dashboard-search" placeholder="Search rounds">
        </div>
        <div id="round-list"></div>
      </main>
    </div>

    <!-- Flow view -->
    <div id="flow-view" hidden>
      <header id="flow-toolbar" class="flow-toolbar"></header>
      <div id="flow-main-split">
        <div id="flow-area">
          <nav id="partner-tabs" class="partner-tabs" role="tablist" aria-label="Partner tabs"></nav>
          <nav id="tabbar" class="tabbar">
            <div id="tabs" role="tablist" aria-label="Sheet tabs"></div>
          </nav>
          <div id="grid-wrap"></div>
          <footer id="grid-footer">
            <button type="button" id="add-row-btn" class="tb-btn">Add row</button>
          </footer>
        </div>
        <aside id="coach-panel" aria-label="AI Coach" hidden>
          <div id="sb-header">
            <span class="sb-title">AI Coach</span>
            <button type="button" id="mode-toggle" class="tb-btn">Free chat</button>
            <button type="button" id="coach-collapse" class="tb-btn" title="Hide coach" aria-label="Hide coach">Hide</button>
          </div>
          <div id="chat-history" role="log" aria-live="polite"></div>
          <div id="sb-input-wrap">
            <div id="cell-context-banner"></div>
            <textarea id="sb-input" placeholder="Ask the coach… (Enter to send)" aria-label="Coach message"></textarea>
            <div id="send-row">
              <button type="button" id="send-btn">Send</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div id="files-panel" class="files-panel" aria-label="Upload cards">
    <div class="files-cols">
      <div class="files-col">
        <h4>Our cards</h4>
        <div class="dropzone" data-owner="ours">
          Drag and drop .docx or .txt
          <br><button type="button" class="pick-btn" data-owner="ours">Choose files</button>
        </div>
        <div class="files-list" data-owner="ours"></div>
      </div>
      <div class="files-col">
        <h4>Opponent cards</h4>
        <div class="dropzone" data-owner="opponent">
          Drag and drop .docx or .txt
          <br><button type="button" class="pick-btn" data-owner="opponent">Choose files</button>
        </div>
        <div class="files-list" data-owner="opponent"></div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept=".docx,.txt" multiple hidden>
  <input type="file" id="backup-input" accept=".mxflow,.json" hidden>

  <menu id="ctx-menu" role="menu" aria-label="Cell actions">
    <button type="button" data-action="generate" role="menuitem">Generate response</button>
    <hr class="sep">
    <button type="button" data-action="dropped" role="menuitem">Mark dropped</button>
    <button type="button" data-action="conceded" role="menuitem">Mark conceded</button>
    <button type="button" data-action="normal" role="menuitem">Clear marking</button>
    <hr class="sep">
    <button type="button" data-action="clear" role="menuitem">Clear cell</button>
  </menu>

  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div id="settings-modal" class="settings-modal">
      <h2 id="settings-title">Settings</h2>
      <div class="field">
        <label>Theme</label>
        <div id="theme-swatches" class="theme-swatches"></div>
      </div>
      <div class="field">
        <label for="set-grid-font">Grid font</label>
        <select id="set-grid-font">
          <option value="Arial, sans-serif">Arial</option>
          <option value="Courier New, monospace">Courier New</option>
          <option value="Times New Roman, serif">Times New Roman</option>
        </select>
      </div>
      <div class="field">
        <label for="set-cell-style">Active cell style</label>
        <select id="set-cell-style">
          <option value="outlineBlack">Outline</option>
          <option value="filledBlue">Filled</option>
        </select>
      </div>
      <div class="field">
        <label for="set-side">Your side</label>
        <select id="set-side">
          <option value="aff">AFF</option>
          <option value="neg">NEG</option>
        </select>
      </div>
      <div class="field">
        <label for="set-partner1">Partner 1 name</label>
        <input type="text" id="set-partner1">
      </div>
      <div class="field">
        <label for="set-partner2">Partner 2 name</label>
        <input type="text" id="set-partner2">
      </div>
      <div class="field">
        <label for="set-tournament">Tournament</label>
        <input type="text" id="set-tournament" placeholder="Yale RR">
      </div>
      <div class="field">
        <label for="set-round-num">Round</label>
        <input type="text" id="set-round-num" placeholder="4">
      </div>
      <div class="field">
        <label for="set-judges">Judges</label>
        <input type="text" id="set-judges">
      </div>
      <div class="field">
        <label for="set-aff-school">Aff school</label>
        <input type="text" id="set-aff-school">
      </div>
      <div class="field">
        <label for="set-aff-code">Aff code</label>
        <input type="text" id="set-aff-code">
      </div>
      <div class="field">
        <label for="set-neg-school">Neg school</label>
        <input type="text" id="set-neg-school">
      </div>
      <div class="field">
        <label for="set-neg-code">Neg code</label>
        <input type="text" id="set-neg-code">
      </div>
      <div class="field">
        <label for="set-opponent">Opponent school</label>
        <input type="text" id="set-opponent" placeholder="Lincoln HS">
      </div>
      <div class="field">
        <label for="set-model">Model</label>
        <select id="set-model">
          <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
          <option value="claude-opus-4-8">claude-opus-4-8</option>
          <option value="claude-haiku-4-5-20251001">claude-haiku-4-5</option>
        </select>
      </div>
      <div class="field">
        <label for="set-maxtokens">Max tokens</label>
        <input type="number" id="set-maxtokens" value="1000" min="100" max="8000">
      </div>
      <div class="field field-check">
        <label><input type="checkbox" id="set-insert"> Insert mode (Enter = newline in cell)</label>
      </div>
      <p class="settings-note">API key is configured on the server via ANTHROPIC_API_KEY.</p>
      <div class="modal-actions">
        <button type="button" id="save-settings" class="tb-btn primary">Save</button>
        <button type="button" id="close-settings">Cancel</button>
      </div>
      <button type="button" id="clear-flow-btn" class="tb-btn danger">Clear all flows</button>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
